# Render Blueprint configuration for zero-cost deployment of OmniBid India & Affiliate Marketing Suite
services:
  - type: web
    name: omnibid-server
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @omnibid/server build
    startCommand: pnpm --filter @omnibid/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Supabase pooler port 6543
      - key: DIRECT_URL
        sync: false  # Supabase direct port 5432
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: omnibid-affiliate-suite
    runtime: docker
    dockerfilePath: ./affiliate-suite/Dockerfile
    dockerContext: ./affiliate-suite
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SQLITE_DB_PATH
        value: /tmp/affiliate.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: POSTBACK_SECRET
        generateValue: true
      - key: OMNIBID_API_URL
        value: https://prompt-understander-1.onrender.com
