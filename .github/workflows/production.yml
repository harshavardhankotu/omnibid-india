name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 11 # Aligns with local pnpm v11 workspace version

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --dangerously-allow-all-builds

      - name: Build Database Declarations
        run: npx tsc -b drizzle

      - name: Execute Workspace Typechecks
        run: pnpm run typecheck

      - name: Run Global Vitest Suite
        run: npx vitest run

      - name: Setup Python 3.11 (Affiliate Suite)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Affiliate Suite Python Syntax
        run: |
          python -m py_compile affiliate-suite/*.py
